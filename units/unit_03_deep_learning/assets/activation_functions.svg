<text x="400" y="150" class="label" text-anchor="middle">Sigmoid</text><text x="1200" y="150" class="label" text-anchor="middle">ReLU</text>
<path d="M150 700 H700 M400 300 V780" class="line"/><text x="670" y="740" class="small">input score</text><text x="420" y="325" class="small">output</text>
<text x="350" y="335" class="tiny">1.0</text><text x="350" y="705" class="tiny">0.0</text>
<path d="M165 690 C250 690 285 680 320 645 C370 590 370 520 400 500 C430 480 430 410 480 365 C530 325 600 315 685 310" fill="none" stroke="#d96c4f" stroke-width="10" stroke-linecap="round"/>
<text x="400" y="850" class="small" text-anchor="middle">Squishes to probability</text>
