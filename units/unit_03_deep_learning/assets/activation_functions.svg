<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>
 text { font-family: 'Chalkboard SE', 'Comic Sans MS', sans-serif; fill: #1f3a5f; }
 .title { font-size: 46px; font-weight: bold; }
 .label { font-size: 30px; font-weight: bold; }
 .small { font-size: 25px; }
 .tiny { font-size: 21px; }
 .line { fill: none; stroke: #1f3a5f; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
 .thin { fill: none; stroke: #1f3a5f; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
</style>
<text x="80" y="80" class="title">Activation functions</text>
