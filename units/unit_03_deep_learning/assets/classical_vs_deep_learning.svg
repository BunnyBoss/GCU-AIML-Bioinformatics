<path d="M800 130 L800 910" stroke="#cad7df" stroke-width="4" stroke-dasharray="14 18"/>
<text x="310" y="145" class="label" text-anchor="middle">Classical ML</text>
<text x="1220" y="145" class="label" text-anchor="middle">Deep Learning</text>
<text x="310" y="185" class="small" text-anchor="middle">hand-crafted features first</text>
<text x="1220" y="185" class="small" text-anchor="middle">learns from raw data</text>
