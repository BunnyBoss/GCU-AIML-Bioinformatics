<text x="172" y="455" class="small">18.1</text><text x="283" y="455" class="small">0.34</text><text x="414" y="455" class="small">?</text>
<text x="172" y="525" class="small">9.7</text><text x="283" y="525" class="small">0.81</text><text x="414" y="525" class="small">?</text>
