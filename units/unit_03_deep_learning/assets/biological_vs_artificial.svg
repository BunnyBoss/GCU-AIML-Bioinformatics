<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>
 text { font-family: 'Chalkboard SE', 'Comic Sans MS', sans-serif; fill: #1f3a5f; }
 .title { font-size: 46px; font-weight: bold; }
 .label { font-size: 30px; font-weight: bold; }
 .small { font-size: 25px; }
 .tiny { font-size: 21px; }
 .line { fill: none; stroke: #1f3a5f; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
 .thin { fill: none; stroke: #1f3a5f; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
</style>
<text x="80" y="80" class="title">From biology to a perceptron</text>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#1f3a5f"/></marker></defs><path d="M800 135 L800 900" stroke="#cad7df" stroke-width="4" stroke-dasharray="14 18"/>
<text x="400" y="150" class="label" text-anchor="middle">Biological Neuron</text><text x="1200" y="150" class="label" text-anchor="middle">Artificial Neuron</text>
<path d="M350 430 C300 370 230 340 180 285 M350 430 C270 440 210 490 160 555 M350 430 C285 390 220 400 145 390 M360 420 C310 300 300 235 285 190" class="line"/>
<circle cx="475" cy="450" r="115" fill="#f7e9df" stroke="#d96c4f" stroke-width="8"/><path d="M585 450 C680 450 700 480 770 520" class="line"/>
<path d="M660 440 q35 -35 70 0 q35 35 70 0" class="thin"/>
<text x="140" y="640" class="small">Dendrites (Receivers)</text><path d="M300 600 L250 520" class="thin"/>
<text x="405" y="650" class="small">Soma (Calculator)</text><path d="M450 610 L470 565" class="thin"/>
<text x="510" y="260" class="small">Synapses (Weights)</text><path d="M560 280 L570 385" class="thin"/>
<text x="605" y="560" class="small">Axon (Decision)</text><path d="M620 540 L650 480" class="thin"/>
<circle cx="1030" cy="455" r="120" fill="#eef4f7" stroke="#1f3a5f" stroke-width="8"/>
<path d="M900 300 L1000 390 M870 455 L900 455 M900 610 L1000 520" class="line" marker-end="url(#arrow)"/>
<path d="M1150 455 L1340 455" class="line" marker-end="url(#arrow)"/>
<text x="880" y="255" class="small">Inputs (Receivers)</text><text x="835" y="710" class="small">Weights</text>
<text x="1030" y="445" class="small" text-anchor="middle">Summation</text><text x="1030" y="480" class="small" text-anchor="middle">(Calculator)</text>
<text x="1230" y="415" class="small">Output (Decision)</text>
<text x="1030" y="800" class="label" text-anchor="middle">same idea • different substrate</text>
</svg>